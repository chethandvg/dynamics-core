[package]
name = "dynamics-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Leaky integrators and periodic pulses, with Lean 4 proofs of when repeated pulses add up and when they are forgotten."
license = "Apache-2.0"
authors = ["Chethan Dandebala Venkatarama"]
repository = "https://github.com/chethandvg/dynamics-core"
homepage = "https://chethandvg.github.io/frequencies-of-life/repos/dynamics-core/"
readme = "README.md"
keywords = ["dynamics", "leaky-integrator", "lean4", "formal-verification", "calcium-signalling"]
categories = ["mathematics", "science"]
include = ["/src", "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md"]

[dependencies]
rhythm-units = { git = "https://github.com/chethandvg/rhythm-units", tag = "v0.1.0" }

[dev-dependencies]
golden-vectors = { git = "https://github.com/chethandvg/evidence-kernel", tag = "v0.1.0" }
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
