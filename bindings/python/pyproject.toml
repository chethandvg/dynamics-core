[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "dynamics-core"
version = "0.1.0"
description = "Leaky integrators and periodic pulses, with Lean 4 proofs of when repeated pulses add up and when they are forgotten."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Chethan Dandebala Venkatarama" }]
requires-python = ">=3.10"
keywords = ["dynamics", "leaky-integrator", "lean4", "formal-verification", "calcium-signalling"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://chethandvg.github.io/frequencies-of-life/repos/dynamics-core/"
Repository = "https://github.com/chethandvg/dynamics-core"

[tool.maturin]
module-name = "dynamics_core"
