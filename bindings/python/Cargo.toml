[package]
name = "dynamics-core-py"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "dynamics_core"
crate-type = ["cdylib"]

[dependencies]
dynamics_core_rs = { package = "dynamics-core", path = "../.." }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }

# A separate workspace, so the core crate's `cargo test` never links Python.
[workspace]
